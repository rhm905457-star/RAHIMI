<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>خاطرات</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#08080e;--card:rgba(255,255,255,0.045);--card2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.09);--gold:#d4af37;--gold2:#f7e3a1;
  --violet:#8b6cff;--violet2:#b39cff;--text:#f0f0f7;--muted:#8a8aa3;
  --danger:#ff5c72;--success:#3ddc97;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);
  font-family:'Vazirmatn',sans-serif;user-select:none;-webkit-user-select:none;position:fixed;width:100%;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(circle at 15% 10%,rgba(139,108,255,.22),transparent 45%),
   radial-gradient(circle at 85% 85%,rgba(212,175,55,.16),transparent 45%),
   radial-gradient(circle at 50% 50%,rgba(20,20,35,.6),transparent 70%),
   var(--bg);}
::-webkit-scrollbar{display:none;}
input,textarea,button{font-family:inherit;color:inherit;outline:none;border:none;background:none;}
input,textarea{user-select:text;-webkit-user-select:text;}

/* ===== Screens ===== */
.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transform:translateY(14px) scale(.99);
  transition:opacity .4s cubic-bezier(.22,1,.36,1),transform .4s cubic-bezier(.22,1,.36,1);}
.screen.active{opacity:1;pointer-events:auto;transform:none;}

/* ===== LOCK ===== */
#lockScreen{align-items:center;justify-content:center;
  padding:calc(40px + var(--safe-top)) 24px calc(40px + var(--safe-bottom));}
.lock-content{display:flex;flex-direction:column;align-items:center;width:100%;max-width:340px;}
.logo{position:relative;width:90px;height:90px;margin-bottom:22px;display:flex;align-items:center;justify-content:center;}
.logo-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;
  background:linear-gradient(135deg,var(--gold),var(--violet),var(--gold)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 9s linear infinite;}
.logo-core{width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold2),var(--violet));
  box-shadow:0 0 32px rgba(212,175,55,.45),0 0 60px rgba(139,108,255,.3);
  display:flex;align-items:center;justify-content:center;font-size:20px;}
@keyframes spin{to{transform:rotate(360deg);}}
.brand{font-size:27px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(135deg,var(--gold2),var(--violet2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-sub{font-size:12.5px;color:var(--muted);margin:8px 0 30px;letter-spacing:.5px;text-align:center;}

.pin-dots{display:flex;gap:15px;margin-bottom:34px;direction:ltr;}
.pin-dots span{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);transition:.25s;}
.pin-dots span.filled{background:linear-gradient(135deg,var(--gold2),var(--violet2));border-color:transparent;
  box-shadow:0 0 14px rgba(212,175,55,.65);transform:scale(1.15);}
.pin-dots.error span{animation:shake .4s;border-color:var(--danger);}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;width:100%;max-width:270px;}
.keypad button{aspect-ratio:1;border-radius:50%;border:1px solid var(--border);background:var(--card);
  color:var(--text);font-size:22px;font-weight:600;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;transition:.12s;}
.keypad button:active{transform:scale(.9);background:rgba(212,175,55,.18);border-color:rgba(212,175,55,.4);}
.keypad button.ghost{background:transparent;border:none;font-size:15px;color:var(--muted);}
.lock-hint{margin-top:22px;font-size:12.5px;color:var(--muted);min-height:18px;text-align:center;}
.lock-hint.err{color:var(--danger);}

/* ===== HEADER ===== */
.app-header{padding:calc(18px + var(--safe-top)) 20px 14px;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
#greeting{font-size:23px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,#fff,var(--violet2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--text);font-size:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.15s;}
.icon-btn:active{transform:scale(.92);background:var(--card2);}
.search-wrap{position:relative;}
.search{width:100%;padding:13px 18px;border-radius:16px;border:1px solid var(--border);background:var(--card);
  color:var(--text);font-size:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.2s;}
.search::placeholder{color:var(--muted);}
.search:focus{border-color:rgba(212,175,55,.4);background:var(--card2);}

/* ===== ENTRIES ===== */
.entries{flex:1;overflow-y:auto;padding:6px 20px calc(140px + var(--safe-bottom));display:flex;flex-direction:column;gap:14px;}
.entry-card{position:relative;padding:18px 18px 16px;border-radius:20px;border:1px solid var(--border);
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:.25s;animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;overflow:hidden;}
.entry-card::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;
  background:linear-gradient(135deg,rgba(212,175,55,.25),transparent 40%,rgba(139,108,255,.25));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7;}
.entry-card:active{transform:scale(.975);background:rgba(255,255,255,.09);}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.entry-card .e-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.entry-card .e-title{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.entry-card .e-mood{font-size:20px;margin-right:10px;filter:drop-shadow(0 0 8px rgba(212,175,55,.4));}
.entry-card .e-body{font-size:13.5px;color:var(--muted);line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.entry-card .e-date{font-size:11px;color:var(--gold);margin-top:12px;letter-spacing:.5px;
  display:flex;align-items:center;gap:6px;}
.entry-card .fav-mark{color:var(--gold);font-size:13px;}

/* ===== EMPTY ===== */
.empty-state{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:0 40px;pointer-events:none;gap:6px;}
.empty-state.show{display:flex;}
.empty-state .empty-ring{width:70px;height:70px;border-radius:50%;border:1.5px dashed rgba(212,175,55,.35);
  margin-bottom:18px;animation:spin 12s linear infinite;}
.empty-state p{font-size:15px;font-weight:600;color:var(--text);}
.empty-state span{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7;}

/* ===== FAB + BOTTOM BAR ===== */
.fab{position:fixed;bottom:calc(92px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  width:62px;height:62px;border-radius:50%;z-index:5;font-size:30px;font-weight:300;color:#1a1408;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  box-shadow:0 10px 32px rgba(212,175,55,.45),0 0 0 1px rgba(255,255,255,.15) inset;
  display:flex;align-items:center;justify-content:center;transition:.2s;}
.fab:active{transform:translateX(-50%) scale(.9);}
.fab::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1px solid rgba(212,175,55,.35);animation:pulse 2.5s infinite;}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:4;
  padding:10px 20px calc(10px + var(--safe-bottom));
  display:flex;justify-content:space-around;
  background:linear-gradient(to top,rgba(8,8,14,.98),rgba(8,8,14,.6) 70%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.nav-item{padding:8px 18px;border-radius:12px;font-size:12.5px;color:var(--muted);transition:.2s;}
.nav-item.active{color:var(--gold2);background:rgba(212,175,55,.12);font-weight:600;}

/* ===== EDITOR ===== */
.editor-header{display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + var(--safe-top)) 18px 16px;border-bottom:1px solid var(--border);}
.editor-header span{font-size:14px;color:var(--muted);font-weight:500;}
.save-btn{padding:8px 22px;border-radius:12px;font-size:13.5px;font-weight:700;color:#1a1408;
  background:linear-gradient(135deg,var(--gold2),var(--gold));transition:.15s;}
.save-btn:active{transform:scale(.94);}
.editor-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.entry-title{font-size:24px;font-weight:700;color:var(--text);padding:6px 0;}
.entry-title::placeholder{color:rgba(255,255,255,.15);}
.meta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.entry-date{padding:9px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);
  font-size:12.5px;color:var(--muted);}
.entry-date::-webkit-calendar-picker-indicator{filter:invert(.6);}
.mood-picker{display:flex;gap:6px;flex-wrap:wrap;}
.mood-picker button{width:36px;height:36px;border-radius:50%;font-size:18px;
  border:1px solid var(--border);background:var(--card);transition:.15s;
  display:flex;align-items:center;justify-content:center;}
.mood-picker button.active{border-color:var(--gold);background:rgba(212,175,55,.18);transform:scale(1.12);
  box-shadow:0 0 16px rgba(212,175,55,.4);}
.entry-body{flex:1;min-height:260px;font-size:15px;line-height:1.9;color:var(--text);
  resize:none;padding:6px 0;font-weight:300;}
.entry-body::placeholder{color:rgba(255,255,255,.15);}

/* ===== VIEW ===== */
.view-body{flex:1;overflow-y:auto;padding:26px 22px 20px;}
#viewTitle{font-size:26px;font-weight:800;margin-bottom:14px;line-height:1.4;
  background:linear-gradient(135deg,#fff,var(--violet2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.view-meta{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.view-meta span{font-size:12.5px;color:var(--muted);}
.view-meta #viewMood{font-size:22px;}
#viewBody{font-size:15px;line-height:2;color:#d6d6e3;font-weight:300;white-space:pre-wrap;word-break:break-word;}
.view-actions{display:flex;gap:12px;padding:16px 22px calc(24px + var(--safe-bottom));}
.action-btn{flex:1;padding:14px;border-radius:14px;font-size:14px;font-weight:600;
  border:1px solid var(--border);background:var(--card);transition:.15s;}
.action-btn:active{transform:scale(.96);background:var(--card2);}
.action-btn.danger{color:var(--danger);border-color:rgba(255,92,114,.3);background:rgba(255,92,114,.08);}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:calc(180px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);
  padding:12px 22px;border-radius:14px;font-size:13px;font-weight:500;z-index:100;
  background:rgba(30,30,45,.95);border:1px solid var(--border);color:var(--text);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  opacity:0;pointer-events:none;transition:.3s cubic-bezier(.22,1,.36,1);white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{border-color:rgba(255,92,114,.4);color:#ffb3bf;}
.toast.ok{border-color:rgba(61,220,151,.4);color:#a8f5d4;}

/* ===== MODAL CONFIRM ===== */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:30px;opacity:0;transition:.25s;}
.modal-bg.show{display:flex;opacity:1;}
.modal{width:100%;max-width:320px;padding:26px 22px;border-radius:22px;
  background:linear-gradient(160deg,rgba(30,30,45,.98),rgba(18,18,28,.98));
  border:1px solid var(--border);transform:scale(.92);transition:.25s;}
.modal-bg.show .modal{transform:scale(1);}
.modal h3{font-size:17px;font-weight:700;margin-bottom:10px;}
.modal p{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:22px;}
.modal-btns{display:flex;gap:10px;}
.modal-btns button{flex:1;padding:12px;border-radius:12px;font-size:13.5px;font-weight:600;
  border:1px solid var(--border);background:var(--card);transition:.15s;}
.modal-btns button:active{transform:scale(.95);}
.modal-btns .confirm{background:linear-gradient(135deg,var(--danger),#cc3a50);color:#fff;border:none;}
</style>
</head>
<body>

<!-- ===== LOCK ===== -->
<div id="lockScreen" class="screen active">
  <div class="lock-content">
    <div class="logo">
      <div class="logo-ring"></div>
      <div class="logo-core">🔒</div>
    </div>
    <h1 class="brand">خاطرات</h1>
    <p class="brand-sub" id="lockSub">رمز خود را وارد کنید</p>

    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="keypad" id="keypad"></div>
    <p class="lock-hint" id="lockHint"></p>
  </div>
</div>

<!-- ===== HOME ===== -->
<div id="homeScreen" class="screen">
  <header class="app-header">
    <div class="header-top">
      <h2 id="greeting">خاطرات من</h2>
      <button class="icon-btn" id="logoutBtn" aria-label="قفل">🔒</button>
    </div>
    <div class="search-wrap">
      <input id="searchInput" class="search" type="text" placeholder="جستجو در خاطرات..." />
    </div>
  </header>

  <main class="entries" id="entriesList"></main>

  <div class="empty-state" id="emptyState">
    <div class="empty-ring"></div>
    <p>هنوز خاطره‌ای ثبت نکردی</p>
    <span>روی دکمه + بزن و اولین خاطره‌ات رو بنویس</span>
  </div>

  <button class="fab" id="addBtn">+</button>

  <nav class="bottom-bar">
    <button class="nav-item active" data-tab="all">همه</button>
    <button class="nav-item" data-tab="fav">محبوب</button>
    <button class="nav-item" data-tab="mood">حال‌وهوا</button>
  </nav>
</div>

<!-- ===== EDITOR ===== -->
<div id="editorScreen" class="screen">
  <header class="editor-header">
    <button class="icon-btn" id="backBtn">✕</button>
    <span id="editorTitle">خاطره جدید</span>
    <button class="save-btn" id="saveBtn">ذخیره</button>
  </header>
  <div class="editor-body">
    <input id="entryTitle" class="entry-title" placeholder="عنوان..." maxlength="80" />
    <div class="meta-row">
      <input id="entryDate" class="entry-date" type="date" />
      <div class="mood-picker" id="moodPicker">
        <button data-mood="happy">😊</button>
        <button data-mood="calm">😌</button>
        <button data-mood="sad">😢</button>
        <button data-mood="angry">😡</button>
        <button data-mood="love">🥰</button>
        <button data-mood="tired">😴</button>
      </div>
    </div>
    <textarea id="entryBody" class="entry-body" placeholder="امروز چه اتفاقی افتاد؟"></textarea>
  </div>
</div>

<!-- ===== VIEW ===== -->
<div id="viewScreen" class="screen">
  <header class="editor-header">
    <button class="icon-btn" id="viewBackBtn">←</button>
    <span>مشاهده</span>
    <button class="icon-btn" id="viewFavBtn">☆</button>
  </header>
  <div class="view-body">
    <h2 id="viewTitle"></h2>
    <div class="view-meta">
      <span id="viewDate"></span>
      <span id="viewMood"></span>
    </div>
    <p id="viewBody"></p>
  </div>
  <div class="view-actions">
    <button id="editBtn" class="action-btn">ویرایش</button>
    <button id="deleteBtn" class="action-btn danger">حذف</button>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="modal-btns">
      <button id="modalCancel">انصراف</button>
      <button id="modalConfirm" class="confirm">تایید</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   APP STATE
========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const PIN_LEN = 8;
const MOODS = {happy:'😊',calm:'😌',sad:'😢',angry:'😡',love:'🥰',tired:'😴'};

let pinBuffer = '';
let pinStep = 'enter'; // enter | set | confirm
let tempPin = '';
let cryptoKey = null;
let entries = [];
let filteredEntries = [];
let currentTab = 'all';
let currentEntryId = null;
let searchQuery = '';

/* =========================================================
   CRYPTO (Web Crypto API)
========================================================= */
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}
function unb64(str){return Uint8Array.from(atob(str),c=>c.charCodeAt(0));}

async function deriveKey(pin, salt){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'},
    baseKey,
    {name:'AES-GCM', length:256},
    false, ['encrypt','decrypt']
  );
}

async function encryptData(data, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(data)));
  return { iv: b64(iv), data: b64(ct) };
}

async function decryptData(payload, key){
  const iv = unb64(payload.iv);
  const ct = unb64(payload.data);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* =========================================================
   STORAGE
========================================================= */
const STORE_KEY = 'diary_vault_v1';

function getVault(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; } }
function setVault(v){ localStorage.setItem(STORE_KEY, JSON.stringify(v)); }
function hasVault(){ return !!getVault(); }

async function saveEntries(){
  const vault = getVault();
  if(!vault || !cryptoKey) return;
  const enc = await encryptData(entries, cryptoKey);
  vault.payload = enc;
  setVault(vault);
}

async function loadEntries(){
  const vault = getVault();
  if(!vault || !vault.payload) return;
  try {
    entries = await decryptData(vault.payload, cryptoKey);
  } catch(e) {
    entries = [];
  }
}

/* =========================================================
   LOCK SCREEN
========================================================= */
function initKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  const kp = $('#keypad');
  kp.innerHTML = '';
  keys.forEach(k => {
    const b = document.createElement('button');
    if(k === '') { b.className = 'ghost'; b.style.visibility='hidden'; }
    else if(k === '⌫') { b.className = 'ghost'; b.textContent = '⌫'; }
    else b.textContent = k;
    b.addEventListener('click', () => handleKey(k));
    kp.appendChild(b);
  });
}

function updateDots(){
  $$('#pinDots span').forEach((s,i) => s.classList.toggle('filled', i < pinBuffer.length));
}

function handleKey(k){
  if(k === '⌫'){ pinBuffer = pinBuffer.slice(0,-1); updateDots(); return; }
  if(!/^\d$/.test(k)) return;
  if(pinBuffer.length >= PIN_LEN) return;
  pinBuffer += k;
  updateDots();
  if(pinBuffer.length === PIN_LEN) setTimeout(processPin, 150);
}

async function processPin(){
  const pin = pinBuffer;
  pinBuffer = '';
  updateDots();

  if(pinStep === 'set'){
    tempPin = pin;
    pinStep = 'confirm';
    $('#lockSub').textContent = 'رمز را دوباره وارد کنید';
    $('#lockHint').textContent = '';
    return;
  }

  if(pinStep === 'confirm'){
    if(pin !== tempPin){
      showLockError('رمزها یکسان نیستند');
      pinStep = 'set'; tempPin = '';
      $('#lockSub').textContent = 'یک رمز ۸ رقمی بسازید';
      return;
    }
    // create new vault
    const salt = crypto.getRandomValues(new Uint8Array(16));
    cryptoKey = await deriveKey(pin, salt);
    entries = [];
    setVault({ salt: b64(salt), payload: null });
    await saveEntries();
    showLockError('');
    enterApp();
    toast('رمز با موفقیت ساخته شد ✓', 'ok');
    return;
  }

  // enter mode
  const vault = getVault();
  if(!vault) return;
  try {
    const salt = unb64(vault.salt);
    cryptoKey = await deriveKey(pin, salt);
    await loadEntries(); // throws if wrong
    showLockError('');
    enterApp();
  } catch(e) {
    showLockError('رمز اشتباه است');
    pinDotsError();
  }
}

function showLockError(msg){
  const h = $('#lockHint');
  h.textContent = msg;
  h.classList.toggle('err', !!msg);
}

function pinDotsError(){
  const d = $('#pinDots');
  d.classList.add('error');
  setTimeout(() => d.classList.remove('error'), 450);
}

function enterApp(){
  $('#lockScreen').classList.remove('active');
  $('#homeScreen').classList.add('active');
  renderEntries();
}

function lockApp(){
  cryptoKey = null;
  entries = [];
  pinBuffer = '';
  updateDots();
  if(!hasVault()){
    pinStep = 'set';
    $('#lockSub').textContent = 'یک رمز ۸ رقمی بسازید';
  } else {
    pinStep = 'enter';
    $('#lockSub').textContent = 'رمز خود را وارد کنید';
  }
  showLockError('');
  $('#homeScreen').classList.remove('active');
  $('#editorScreen').classList.remove('active');
  $('#viewScreen').classList.remove('active');
  $('#lockScreen').classList.add('active');
}

/* =========================================================
   RENDER ENTRIES
========================================================= */
function formatDate(d){
  try {
    const dt = new Date(d);
    return dt.toLocaleDateString('fa-IR', {year:'numeric', month:'long', day:'numeric'});
  } catch { return d; }
}

function renderEntries(){
  const list = $('#entriesList');
  const empty = $('#emptyState');
  list.innerHTML = '';

  let data = [...entries];

  if(currentTab === 'fav') data = data.filter(e => e.fav);
  else if(currentTab === 'mood') data = data.filter(e => e.mood);

  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    data = data.filter(e =>
      (e.title||'').toLowerCase().includes(q) ||
      (e.body||'').toLowerCase().includes(q)
    );
  }

  data.sort((a,b) => new Date(b.date) - new Date(a.date));
  filteredEntries = data;

  if(data.length === 0){
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  data.forEach((e, i) => {
    const card = document.createElement('div');
    card.className = 'entry-card';
    card.style.animationDelay = (i*40) + 'ms';
    const preview = (e.body||'').replace(/\n/g,' ').slice(0,120);
    card.innerHTML = `
      <div class="e-top">
        <div class="e-title">${escapeHtml(e.title || 'بدون عنوان')} ${e.fav ? '<span class="fav-mark">★</span>' : ''}</div>
        <div class="e-mood">${MOODS[e.mood]||''}</div>
      </div>
      <div class="e-body">${escapeHtml(preview)}${(e.body||'').length>120?'...':''}</div>
      <div class="e-date">📅 ${formatDate(e.date)}</div>
    `;
    card.addEventListener('click', () => openView(e.id));
    list.appendChild(card);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   EDITOR
========================================================= */
let editingId = null;
let selectedMood = null;

function openEditor(entry=null){
  editingId = entry ? entry.id : null;
  selectedMood = entry ? entry.mood : null;

  $('#editorTitle').textContent = entry ? 'ویرایش خاطره' : 'خاطره جدید';
  $('#entryTitle').value = entry ? entry.title : '';
  $('#entryDate').value = entry ? entry.date : new Date().toISOString().slice(0,10);
  $('#entryBody').value = entry ? entry.body : '';
  $$('#moodPicker button').forEach(b =>
    b.classList.toggle('active', b.dataset.mood === selectedMood)
  );

  $('#homeScreen').classList.remove('active');
  $('#editorScreen').classList.add('active');
}

async function saveEntry(){
  const title = $('#entryTitle').value.trim();
  const body = $('#entryBody').value.trim();
  const date = $('#entryDate').value || new Date().toISOString().slice(0,10);

  if(!title && !body){
    toast('خاطره خالی است', 'err');
    return;
  }

  if(editingId){
    const e = entries.find(x => x.id === editingId);
    if(e){ e.title = title; e.body = body; e.date = date; e.mood = selectedMood; }
  } else {
    entries.push({
      id: crypto.randomUUID(),
      title, body, date,
      mood: selectedMood,
      fav: false,
      createdAt: Date.now()
    });
  }

  await saveEntries();
  toast('ذخیره شد ✓', 'ok');
  $('#editorScreen').classList.remove('active');
  $('#homeScreen').classList.add('active');
  renderEntries();
}

/* =========================================================
   VIEW
========================================================= */
function openView(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  currentEntryId = id;

  $('#viewTitle').textContent = e.title || 'بدون عنوان';
  $('#viewDate').textContent = formatDate(e.date);
  $('#viewMood').textContent = MOODS[e.mood] || '';
  $('#viewBody').textContent = e.body || '';
  $('#viewFavBtn').textContent = e.fav ? '★' : '☆';
  $('#viewFavBtn').style.color = e.fav ? 'var(--gold)' : '';

  $('#homeScreen').classList.remove('active');
  $('#viewScreen').classList.add('active');
}

/* =========================================================
   MODAL
========================================================= */
let modalCallback = null;
function openModal(title, text, cb){
  $('#modalTitle').textContent = title;
  $('#modalText').textContent = text;
  modalCallback = cb;
  $('#modalBg').classList.add('show');
}
function closeModal(){
  $('#modalBg').classList.remove('show');
  modalCallback = null;
}

/* =========================================================
   TOAST
========================================================= */
let toastTimer = null;
function toast(msg, type=''){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =========================================================
   EVENTS
========================================================= */
$('#logoutBtn').addEventListener('click', () => {
  openModal('قفل اپلیکیشن', 'آیا می‌خواهید از اپ خارج شوید؟', () => {
    closeModal();
    lockApp();
  });
});

$('#addBtn').addEventListener('click', () => openEditor());

$('#backBtn').addEventListener('click', () => {
  $('#editorScreen').classList.remove('active');
  $('#homeScreen').classList.add('active');
});

$('#saveBtn').addEventListener('click', saveEntry);

$('#viewBackBtn').addEventListener('click', () => {
  $('#viewScreen').classList.remove('active');
  $('#homeScreen').classList.add('active');
  renderEntries();
});

$('#viewFavBtn').addEventListener('click', async () => {
  const e = entries.find(x => x.id === currentEntryId);
  if(!e) return;
  e.fav = !e.fav;
  $('#viewFavBtn').textContent = e.fav ? '★' : '☆';
  $('#viewFavBtn').style.color = e.fav ? 'var(--gold)' : '';
  await saveEntries();
});

$('#editBtn').addEventListener('click', () => {
  const e = entries.find(x => x.id === currentEntryId);
  if(!e) return;
  $('#viewScreen').classList.remove('active');
  openEditor(e);
});

$('#deleteBtn').addEventListener('click', () => {
  openModal('حذف خاطره', 'این خاطره برای همیشه حذف می‌شود. مطمئنید؟', async () => {
    closeModal();
    entries = entries.filter(x => x.id !== currentEntryId);
    await saveEntries();
    $('#viewScreen').classList.remove('active');
    $('#homeScreen').classList.add('active');
    renderEntries();
    toast('حذف شد', 'ok');
  });
});

$('#modalCancel').addEventListener('click', closeModal);
$('#modalConfirm').addEventListener('click', () => { if(modalCallback) modalCallback(); });

$('#searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderEntries();
});

$$('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    renderEntries();
  });
});

$$('#moodPicker button').forEach(b => {
  b.addEventListener('click', () => {
    selectedMood = selectedMood === b.dataset.mood ? null : b.dataset.mood;
    $$('#moodPicker button').forEach(x =>
      x.classList.toggle('active', x.dataset.mood === selectedMood)
    );
  });
});

/* keyboard support for desktop testing */
document.addEventListener('keydown', e => {
  if($('#lockScreen').classList.contains('active')){
    if(/^\d$/.test(e.key)) handleKey(e.key);
    else if(e.key === 'Backspace') handleKey('⌫');
    return;
  }
  if($('#editorScreen').classList.contains('active') && e.key === 'Escape'){
    $('#backBtn').click();
  }
});

/* =========================================================
   INIT
========================================================= */
initKeypad();
updateDots();

if(!hasVault()){
  pinStep = 'set';
  $('#lockSub').textContent = 'یک رمز ۸ رقمی بسازید';
} else {
  pinStep = 'enter';
  $('#lockSub').textContent = 'رمز خود را وارد کنید';
}
</script>
</body>
</html>
